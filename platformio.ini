[env:esp32dev]
; Pinned so a new pioarduino release can never silently break the build.
; 55.03.311 = Arduino-ESP32 3.3.11 on ESP-IDF 5.5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1

; NAPT (the thing that makes this a repeater) is already compiled into the
; Arduino-ESP32 3.x libraries, so no custom sdkconfig / hybrid build is needed.
; If your link step ever says "undefined reference to ip_napt_enable", see
; docs/guides/building.md ("NAPT is missing").

lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.0.0
    ESP32Async/AsyncTCP @ ^3.0.0
    bblanchon/ArduinoJson @ ^7.0.0
    witnessmenow/UniversalTelegramBot @ ^1.3.0

board_build.partitions = min_spiffs.csv
board_build.filesystem = spiffs

; Adds `pio run -t webflash`: firmware + web UI merged into one flashable file.
extra_scripts = post:scripts/merge_bins.py

name: Build Firmware

on:
  push:
    branches: [ "master", "feature/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host tests (app matching, DNS parsing, speed limiter)
        run: |
          make -C test CXXFLAGS="-std=c++17 -Wall -Wextra -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -I../src"

      - name: Blocklist is up to date
        run: |
          python3 scripts/gen_blocklist.py
          git diff --exit-code src/blocklist_data.h blocklist/compiled-names.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build firmware and web UI, merge into one image
        run: pio run -t webflash

      - name: Check the merged image fits in 4 MB flash
        run: |
          SIZE=$(stat -c%s dist/esp32dev-merged.bin)
          MAX=$((4*1024*1024))
          echo "esp32dev-merged.bin: $SIZE bytes (max $MAX)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::merged image exceeds 4MB flash size"
            exit 1
          fi

      - name: Check the images fit their partitions
        run: |
          APP=$(stat -c%s dist/ota-firmware.bin); UI=$(stat -c%s dist/ota-ui.bin)
          echo "ota-firmware.bin: $APP bytes (max $((0x1C0000)))"
          echo "ota-ui.bin: $UI bytes (max $((0x50000)))"
          [ "$APP" -le $((0x1C0000)) ] || { echo "::error::firmware does not fit the app partition"; exit 1; }
          [ "$UI" -le $((0x50000)) ] || { echo "::error::dashboard files do not fit the spiffs partition"; exit 1; }

      - name: Name the artifacts
        run: |
          NAME="esp32-wifi-repeater-${GITHUB_REF_NAME//\//-}"
          cp dist/esp32dev-merged.bin "$NAME.bin"              # first flash over USB, at offset 0x0
          cp dist/ota-firmware.bin "$NAME-ota-firmware.bin"    # Update over WiFi: firmware
          cp dist/ota-ui.bin "$NAME-ota-ui.bin"                # Update over WiFi: dashboard files
          for f in "$NAME.bin" "$NAME-ota-firmware.bin" "$NAME-ota-ui.bin"; do sha256sum "$f" > "$f.sha256"; done
          echo "ARTIFACT=$NAME" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            ${{ env.ARTIFACT }}*.bin
            ${{ env.ARTIFACT }}*.bin.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARTIFACT }}*.bin
            ${{ env.ARTIFACT }}*.bin.sha256
          generate_release_notes: true

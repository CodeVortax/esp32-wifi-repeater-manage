name: Build Firmware

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build firmware and web UI, merge into one image
        run: pio run -t webflash

      - name: Check the merged image fits in 4 MB flash
        run: |
          SIZE=$(stat -c%s dist/esp32dev-merged.bin)
          MAX=$((4*1024*1024))
          echo "esp32dev-merged.bin: $SIZE bytes (max $MAX)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::merged image exceeds 4MB flash size"
            exit 1
          fi

      - name: Name the artifact
        run: |
          NAME="esp32-wifi-repeater-${GITHUB_REF_NAME//\//-}"
          cp dist/esp32dev-merged.bin "$NAME.bin"
          cp dist/esp32dev-merged.bin.sha256 "$NAME.bin.sha256"
          echo "ARTIFACT=$NAME" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            ${{ env.ARTIFACT }}.bin
            ${{ env.ARTIFACT }}.bin.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARTIFACT }}.bin
            ${{ env.ARTIFACT }}.bin.sha256
          generate_release_notes: true

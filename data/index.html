<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>ESP32 Repeater</title>
<style>
:root{--bg:#0b0f16;--surface:#141a24;--surface2:#1c2432;--line:#283142;--text:#e8ecf4;--muted:#97a2b6;--blue:#4c8dff;--red:#ff6b6b;--green:#3ecf8e;--amber:#f5b94a;
 --c0:#ff5a5f;--c1:#4c8dff;--c2:#3ecf8e;--c3:#f5b94a;--c4:#b57bff;--c5:#ff9f43;--c6:#29c5d6;--c7:#7b8799}
@media(prefers-color-scheme:light){:root{--bg:#eef2f9;--surface:#fff;--surface2:#f1f4fa;--line:#d9e0ee;--text:#18202e;--muted:#5b6679;--blue:#2f6fe4;--red:#d93d3d;--green:#1b9c66;--amber:#b57a0a;
 --c0:#e5383b;--c1:#2f6fe4;--c2:#1b9c66;--c3:#c98a0a;--c4:#8f4fe0;--c5:#e07a1f;--c6:#0f95a6;--c7:#6b7587}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:flex;min-height:100vh;min-height:100dvh}
nav.side{width:224px;flex:none;background:var(--surface);border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:650}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center}
.brand svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;border:0;background:none;color:var(--muted);cursor:pointer;text-align:start;width:100%}
.nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav:hover{background:var(--surface2)}
.nav[aria-current=page]{background:var(--surface2);color:var(--text)}
.nav[aria-current=page] svg{stroke:var(--blue)}
.grow{flex:1}
main{flex:1;min-width:0;padding:22px 24px 40px;max-width:1100px}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
header.top h1{font-size:1.35rem;margin:0;flex:1;font-weight:650}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font-size:.78rem;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--green)}.dot.off{background:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:.95rem;margin:0 0 12px;font-weight:650}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums;margin-top:2px}
.stat span{color:var(--muted);font-size:.78rem}
.muted{color:var(--muted)}.small{font-size:.8rem}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{padding:5px 10px;font-size:.82rem}
input,select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
label.f{display:block;margin:12px 0 5px;font-size:.78rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.user{display:flex;flex-direction:column;gap:11px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-weight:650;flex:none}
.name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend em{width:9px;height:9px;border-radius:3px;display:inline-block}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.72rem;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.tag.red{color:var(--red);border-color:var(--red)}.tag.green{color:var(--green);border-color:var(--green)}.tag.amber{color:var(--amber);border-color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{padding:8px 6px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:.78rem}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.dom{overflow-wrap:anywhere;direction:ltr;unicode-bidi:plaintext}
.hbar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;min-width:60px}
.hbar i{display:block;height:100%;background:var(--blue)}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.banner{background:color-mix(in srgb,var(--amber) 14%,var(--surface));border:1px solid var(--amber);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.88rem}
.note{font-size:.8rem;color:var(--muted);margin-top:10px}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--text);padding:20px;width:min(440px,calc(100vw - 28px))}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{margin:0 0 4px;font-size:1.05rem}
.msg{min-height:1.3em;font-size:.84rem;margin-top:10px}
.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
progress{width:100%;height:8px;accent-color:var(--blue)}
#toast{position:fixed;bottom:84px;inset-inline:0;margin:auto;width:max-content;max-width:calc(100vw - 32px);background:var(--text);color:var(--bg);border-radius:12px;padding:9px 16px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}
[dir=rtl] .stat b,[dir=rtl] .card.user b,[dir=rtl] .tag,[dir=rtl] td.n{direction:ltr;unicode-bidi:isolate}
nav.bottom{display:none}
@media(max-width:760px){
 nav.side{display:none}
 main{padding:16px 14px 96px}
 nav.bottom{display:flex;position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:20}
 nav.bottom .nav{flex-direction:column;gap:2px;padding:7px 2px;font-size:.66rem;justify-content:center;text-align:center;border-radius:10px}
 .two{grid-template-columns:1fr}
 .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Main"></nav>
  <main>
    <header class="top"><h1 id="title"></h1><span class="pill" id="conn"></span></header>
    <div id="banner"></div>
    <div id="page"></div>
  </main>
</div>
<nav class="bottom" id="bottom" aria-label="Main"></nav>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg">
  <form method="dialog" id="dlgForm" style="margin:0">
    <h3 id="dlgTitle"></h3>
    <div class="muted small" id="dlgSub"></div>
    <label class="f" for="dName" data-t="name"></label>
    <input id="dName" maxlength="32" autocomplete="off">
    <label class="f" for="dLimit" data-t="dailyLimit"></label>
    <input id="dLimit" type="number" min="0" max="10000000" inputmode="numeric" placeholder="0">
    <div class="two">
      <div><label class="f" for="dDown" data-t="downMbps"></label><input id="dDown" type="number" min="0" step="0.1" inputmode="decimal"></div>
      <div><label class="f" for="dUp" data-t="upMbps"></label><input id="dUp" type="number" min="0" step="0.1" inputmode="decimal"></div>
    </div>
    <div class="note" data-t="speedBlankHint"></div>
    <label class="row" style="margin-top:14px"><input type="checkbox" id="dWhite" style="width:auto"><span data-t="whitelist"></span></label>
    <div class="msg" id="dMsg"></div>
    <div class="row between wrap" style="margin-top:6px">
      <button type="button" class="btn" id="dBlock"></button>
      <span class="row"><button type="button" class="btn" id="dCancel" data-t="cancel"></button><button type="button" class="btn primary" id="dSave" data-t="save"></button></span>
    </div>
  </form>
</dialog>

let lang=(navigator.language||'').toLowerCase().startsWith('ar')?'ar':'en';
try{const s=localStorage.getItem('lang');if(s==='ar'||s==='en')lang=s}catch(e){}
const t=k=>I18N[lang][k]??I18N.en[k]??k;
const CATKEY=['cat0','cat1','cat2','cat3','cat4','cat5','cat6','cat7'];

/* ---------- tiny helpers ---------- */
const $=id=>document.getElementById(id);
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(k==='style')el.style.cssText=v;
    else if(v===true)el.setAttribute(k,'');
    else el.setAttribute(k,v);
  }
  for(const c of kids.flat(9)){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)))}
  return el;
}
const svg=(d)=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');
  for(const p of d){const e=document.createElementNS('http://www.w3.org/2000/svg','path');e.setAttribute('d',p);s.append(e)}return s};
function fmtBytes(b){b=Number(b)||0;if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(0)+' KB';if(b<1073741824)return (b/1048576).toFixed(b<10485760?1:0)+' MB';return (b/1073741824).toFixed(2)+' GB'}
const fmtKB=kb=>fmtBytes(kb*1024);
function fmtUp(s){const d=Math.floor(s/86400),hh=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return (d?d+'d ':'')+hh+'h '+m+'m'}
function fmtSpeed(kbps){if(kbps===-1)return t('default');if(kbps===0)return t('unlimited');const m=kbps/1000;return (m>=10?m.toFixed(0):m.toFixed(1).replace(/\.0$/,''))+' Mbps'}
const toKbps=v=>Math.round(parseFloat(v)*1000);
let toastTimer;
function toast(msg){const e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2400)}

/* ---------- API ---------- */
async function api(path,opts){
  opts=opts||{};
  const init={method:opts.method||'GET',headers:{'X-Requested-With':'dashboard'}};
  if(opts.body)init.body=new URLSearchParams(opts.body);
  const r=await fetch(path,init);
  if(r.status===401){location.replace('/login');throw new Error('login')}
  return r;
}
async function post(path,body){
  try{const r=await api(path,{method:'POST',body});const txt=await r.text();return {ok:r.ok,text:txt}}
  catch(e){return {ok:false,text:String(e.message||e)}}
}

function otaBox(type,label){
  const file=h('input',{type:'file',accept:'.bin','aria-label':label});

  const msg=h('div',{class:'msg'});

    if(!file.files.length){msg.className='msg err';msg.textContent=t('pickFile');return}
    const fd=new FormData();fd.append('file',file.files[0]);
    const xhr=new XMLHttpRequest();
    xhr.open('POST','/api/ota?type='+type);
    xhr.setRequestHeader('X-Requested-With','dashboard');
    btn.disabled=true;prog.style.display='';msg.className='msg';msg.textContent=t('uploading');
    xhr.upload.onprogress=e=>{if(e.lengthComputable)prog.value=e.loaded/e.total*100};
    xhr.onload=()=>{
      let err='';try{err=JSON.parse(xhr.responseText).error||''}catch(e){}
      if(xhr.status===200){msg.className='msg ok';msg.textContent=t('updDone');setTimeout(()=>location.reload(),9000)}
      else if(xhr.status===401){location.replace('/login')}
      else{msg.className='msg err';msg.textContent=err||t('failed');btn.disabled=false}
    };
    xhr.onerror=()=>{msg.className='msg err';msg.textContent=t('failed');btn.disabled=false};
    xhr.send(fd);
  }},t('upload'));
  return h('div',null,h('label',{class:'f'},label),h('div',{class:'row wrap'},h('div',{style:'flex:1;min-width:200px'},file),btn),prog,msg);
}

  $('dWhite').checked=!!d.whitelisted;
  $('dBlock').textContent=d.blocked?t('unblock'):t('block');
  $('dMsg').textContent='';$('dMsg').className='msg';
  $('dlg').showModal();
}
$('dCancel').onclick=()=>$('dlg').close();
$('dBlock').onclick=async()=>{
  const d=devByMac(dlgMac);if(!d)return;
  const x=await post(d.blocked?'/api/unblock':'/api/block',{mac:dlgMac});
  if(x.ok){$('dlg').close();poke()}else{$('dMsg').className='msg err';$('dMsg').textContent=x.text}
};
$('dSave').onclick=async()=>{
  const d=devByMac(dlgMac);if(!d)return;
  const bad=m=>{$('dMsg').className='msg err';$('dMsg').textContent=m;return false};
  const sp=v=>{v=v.trim();return v===''?'default':String(toKbps(v))};
  const down=sp($('dDown').value),up=sp($('dUp').value);
  if([down,up].some(v=>v!=='default'&&!(Number(v)>=0&&Number(v)<=1000000)))return bad(t('failed'));
  const limit=$('dLimit').value.trim()===''?'0':$('dLimit').value.trim();
  if(!/^\d+$/.test(limit))return bad(t('failed'));
  const jobs=[
    post('/api/rename',{mac:dlgMac,name:$('dName').value.trim()}),
    post('/api/setLimit',{mac:dlgMac,mb:limit}),
    post('/api/speed',{mac:dlgMac,down,up}),
    post('/api/whitelist',{mac:dlgMac,enabled:$('dWhite').checked?'1':'0'})
  ];
  const res=await Promise.all(jobs);
  const fail=res.find(r=>!r.ok);
  if(fail)return bad(fail.text||t('failed'));
  $('dlg').close();toast(t('saved'));poke();
};

/* ---------- data loading ---------- */
const live={ok:false,ws:null,timer:null};
function onStatus(j){
  S.status=j;live.ok=true;renderConn();renderPage(false);
}
async function loadStatus(){try{onStatus(await (await api('/api/status')).json())}catch(e){if(e.message!=='login'){live.ok=false;renderConn()}}}
async function loadApps(){try{S.apps=await (await api('/api/apps')).json()}catch(e){}}
async function loadLearn(){try{S.learn=await (await api('/api/learn')).json()}catch(e){}}
let lastSlow=0;
async function poke(){
  await loadStatus();
  if(['apps','users'].includes(S.page)){await loadApps();if(S.page==='apps')await loadLearn();renderPage(false)}
  lastSlow=Date.now();
}
function openWs(){
  try{
    const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
    live.ws=ws;
    ws.onmessage=e=>{try{onStatus(JSON.parse(e.data))}catch(x){}};
    ws.onclose=()=>{live.ws=null;live.ok=false;renderConn()};
  }catch(e){}
}
async function tick(){
  if(document.hidden)return;
  if(!live.ws||live.ws.readyState!==1){await loadStatus();if(!live.ws)openWs()}
  if(Date.now()-lastSlow>5000&&['apps','users'].includes(S.page)){
    lastSlow=Date.now();await loadApps();if(S.page==='apps')await loadLearn();renderPage(false);
  }
}

/* ---------- start ---------- */
(async function init(){
  const hash=location.hash.slice(1);if(PAGES.some(p=>p[0]===hash))S.page=hash;
  document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  buildNav();renderConn();
  try{S.catalog=await (await api('/api/catalog')).json()}catch(e){}
  await poke();
  openWs();
  setInterval(tick,3000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poke()});
})();
</script>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>My data usage</title>
<style>
:root{--bg:#0b0f16;--surface:#141a24;--surface2:#1c2432;--line:#283142;--text:#e8ecf4;--muted:#97a2b6;--blue:#4c8dff;--red:#ff6b6b;--green:#3ecf8e;--amber:#f5b94a;
 --c0:#ff5a5f;--c1:#4c8dff;--c2:#3ecf8e;--c3:#f5b94a;--c4:#b57bff;--c5:#ff9f43;--c6:#29c5d6;--c7:#7b8799}
@media(prefers-color-scheme:light){:root{--bg:#eef2f9;--surface:#fff;--surface2:#f1f4fa;--line:#d9e0ee;--text:#18202e;--muted:#5b6679;--blue:#2f6fe4;--red:#d93d3d;--green:#1b9c66;--amber:#b57a0a;
 --c0:#e5383b;--c1:#2f6fe4;--c2:#1b9c66;--c3:#c98a0a;--c4:#8f4fe0;--c5:#e07a1f;--c6:#0f95a6;--c7:#6b7587}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Nastaliq Urdu",sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header h1{font-size:1.25rem;margin:0;flex:1;font-weight:650}
select{background:var(--surface);color:inherit;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font:inherit;font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:.9rem;margin:0 0 10px;color:var(--muted);font-weight:600}
.banner{border-radius:14px;padding:14px;margin-bottom:14px;border:1px solid var(--line);background:var(--surface)}
.banner.warn{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,var(--surface))}
.banner.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--surface))}
.banner.good{border-color:var(--green)}
.banner b{display:block;margin-bottom:4px}
.big{font-size:2.1rem;font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.84rem}
.meter{height:14px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--green)}
.meter.w i{background:var(--amber)}.meter.b i{background:var(--red)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend em{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px}
.chart{display:flex;align-items:flex-end;gap:2px;height:90px;direction:ltr}
.chart .col{flex:1;display:flex;flex-direction:column-reverse;height:100%;border-radius:3px;overflow:hidden;background:var(--surface2)}
.chart .col i{display:block;width:100%}
.axis{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);direction:ltr;margin-top:3px}
button.go{width:100%;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-weight:650;padding:13px;margin-top:12px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:.9rem}td{padding:7px 4px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}td.n{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums;direction:ltr}
</style>
</head>
<body>
<main>
  <header><h1 id="title"></h1><select id="lang" aria-label="Language"></select></header>
  <div id="view"><div class="card muted">...</div></div>
</main>
<script>
'use strict';
var L={
en:{n:'English',title:'My data usage',hello:'Hello, {n}',used:'Used today',of:'of {l}',nolimit:'No daily limit',left:'{x} left today',resets:'Resets at midnight',
 ok:'You are within your daily data.',warn:'You have used {p}% of your daily data. Please use it carefully.',limit:'You reached your daily data limit. Your internet is paused until midnight.',
 blocked:'Your internet was paused by the administrator.',off:'The internet is turned off for everyone right now.',ack:'OK, continue',
 cats:'What you used',hours:'Usage by hour',apps:'Top apps',speed:'Speed limit',down:'Download',up:'Upload',unl:'Unlimited',ads:'Ads and trackers blocked',
 unknown:'Open this page while connected to the repeater WiFi.',cat:['Video','Social','Messaging','Browsing','Music','Gaming','Downloads','Other']},
ar:{n:'العربية',rtl:1,title:'استهلاك بياناتي',hello:'مرحبًا {n}',used:'المستهلك اليوم',of:'من {l}',nolimit:'بلا حد يومي',left:'المتبقي اليوم {x}',resets:'يُعاد التصفير عند منتصف الليل',
 ok:'أنت ضمن بياناتك اليومية.',warn:'لقد استهلكت {p}% من بياناتك اليومية. يرجى الاستخدام بحذر.',limit:'وصلت إلى حدّ بياناتك اليومي. الإنترنت متوقف حتى منتصف الليل.',
 blocked:'تم إيقاف الإنترنت عنك من المسؤول.',off:'الإنترنت متوقف عن الجميع حاليًا.',ack:'حسنًا، تابع',
 cats:'ماذا استهلكت',hours:'الاستهلاك بالساعة',apps:'أكثر التطبيقات',speed:'حد السرعة',down:'تنزيل',up:'رفع',unl:'بلا حد',ads:'إعلانات ومتتبعات تم حظرها',
 unknown:'افتح هذه الصفحة وأنت متصل بواي فاي الريبيتر.',cat:['فيديو','اجتماعي','مراسلة','تصفح','موسيقى','ألعاب','تنزيلات','أخرى']},
fr:{n:'Français',title:'Ma consommation de données',hello:'Bonjour, {n}',used:'Utilisé aujourd\'hui',of:'sur {l}',nolimit:'Pas de limite quotidienne',left:'Il reste {x} aujourd\'hui',resets:'Remise à zéro à minuit',
 ok:'Vous êtes dans votre quota quotidien.',warn:'Vous avez utilisé {p} % de vos données du jour. Utilisez-les avec soin.',limit:'Vous avez atteint votre limite quotidienne. Internet est suspendu jusqu\'à minuit.',
 blocked:'Votre accès à Internet a été suspendu par l\'administrateur.',off:'Internet est coupé pour tout le monde pour le moment.',ack:'OK, continuer',
 cats:'Ce que vous avez utilisé',hours:'Consommation par heure',apps:'Applications principales',speed:'Limite de débit',down:'Réception',up:'Envoi',unl:'Illimité',ads:'Publicités et traqueurs bloqués',
 unknown:'Ouvrez cette page connecté au WiFi du répéteur.',cat:['Vidéo','Social','Messagerie','Navigation','Musique','Jeux','Téléchargements','Autre']},
es:{n:'Español',title:'Mi consumo de datos',hello:'Hola, {n}',used:'Usado hoy',of:'de {l}',nolimit:'Sin límite diario',left:'Quedan {x} hoy',resets:'Se reinicia a medianoche',
 ok:'Estás dentro de tus datos diarios.',warn:'Has usado el {p}% de tus datos de hoy. Úsalos con cuidado.',limit:'Has llegado a tu límite diario. Internet está en pausa hasta medianoche.',
 blocked:'El administrador ha pausado tu internet.',off:'Internet está apagado para todos por ahora.',ack:'OK, continuar',
 cats:'Lo que usaste',hours:'Uso por hora',apps:'Apps principales',speed:'Límite de velocidad',down:'Descarga',up:'Subida',unl:'Ilimitado',ads:'Anuncios y rastreadores bloqueados',
 unknown:'Abre esta página conectado al WiFi del repetidor.',cat:['Video','Social','Mensajería','Navegación','Música','Juegos','Descargas','Otros']},
tr:{n:'Türkçe',title:'Veri kullanımım',hello:'Merhaba, {n}',used:'Bugün kullanılan',of:'/ {l}',nolimit:'Günlük sınır yok',left:'Bugün {x} kaldı',resets:'Gece yarısı sıfırlanır',
 ok:'Günlük verin içindesin.',warn:'Günlük verinin %{p} kadarını kullandın. Lütfen dikkatli kullan.',limit:'Günlük veri sınırına ulaştın. İnternet gece yarısına kadar durduruldu.',
 blocked:'İnternetin yönetici tarafından durduruldu.',off:'İnternet şu an herkes için kapalı.',ack:'Tamam, devam',
 cats:'Ne kullandın',hours:'Saatlik kullanım',apps:'En çok kullanılan uygulamalar',speed:'Hız sınırı',down:'İndirme',up:'Yükleme',unl:'Sınırsız',ads:'Engellenen reklam ve izleyiciler',
 unknown:'Bu sayfayı tekrarlayıcının WiFi ağına bağlıyken aç.',cat:['Video','Sosyal','Mesajlaşma','Gezinme','Müzik','Oyun','İndirme','Diğer']},
ur:{n:'اردو',rtl:1,title:'میرا ڈیٹا استعمال',hello:'سلام، {n}',used:'آج استعمال',of:'{l} میں سے',nolimit:'روزانہ کوئی حد نہیں',left:'آج {x} باقی',resets:'آدھی رات کو ری سیٹ ہوگا',
 ok:'آپ اپنے روزانہ ڈیٹا کے اندر ہیں۔',warn:'آپ اپنے روزانہ ڈیٹا کا {p}% استعمال کر چکے ہیں۔ احتیاط سے استعمال کریں۔',limit:'آپ روزانہ ڈیٹا کی حد تک پہنچ گئے ہیں۔ انٹرنیٹ آدھی رات تک بند ہے۔',
 blocked:'ایڈمنسٹریٹر نے آپ کا انٹرنیٹ روک دیا ہے۔',off:'اس وقت سب کے لیے انٹرنیٹ بند ہے۔',ack:'ٹھیک ہے، جاری رکھیں',
 cats:'آپ نے کیا استعمال کیا',hours:'گھنٹہ وار استعمال',apps:'سب سے زیادہ ایپس',speed:'رفتار کی حد',down:'ڈاؤن لوڈ',up:'اپ لوڈ',unl:'لامحدود',ads:'بلاک کیے گئے اشتہارات اور ٹریکرز',
 unknown:'یہ صفحہ ریپیٹر کے وائی فائی سے جڑ کر کھولیں۔',cat:['ویڈیو','سوشل','میسجنگ','براؤزنگ','موسیقی','گیمز','ڈاؤن لوڈز','دیگر']}
};
var lang='en';
try{var nl=(navigator.language||'en').slice(0,2).toLowerCase();if(L[nl])lang=nl;var sv=localStorage.getItem('lang');if(sv&&L[sv])lang=sv}catch(e){}
function T(k,v){var s=(L[lang][k]!=null?L[lang][k]:L.en[k])+'';if(v)for(var x in v)s=s.replace('{'+x+'}',v[x]);return s}
function $(i){return document.getElementById(i)}
function h(tag,attrs){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==='class')e.className=attrs[k];else if(k==='style')e.style.cssText=attrs[k];else if(k.slice(0,2)==='on')e[k]=attrs[k];else e.setAttribute(k,attrs[k])}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;if(c.nodeType)e.appendChild(c);else if(Array.isArray(c))c.forEach(function(x){if(x)e.appendChild(x.nodeType?x:document.createTextNode(x))});else e.appendChild(document.createTextNode(String(c)))}return e}
function fmt(b){b=+b||0;if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(0)+' KB';if(b<1073741824)return(b/1048576).toFixed(b<1e7?1:0)+' MB';return(b/1073741824).toFixed(2)+' GB'}
function fmtKB(k){return fmt(k*1024)}
function spd(k){return k===0?T('unl'):(k/1000>=10?(k/1000).toFixed(0):(k/1000).toFixed(1).replace(/\.0$/,''))+' Mbps'}
var data=null,err=false;

function setLang(){document.documentElement.lang=lang;document.documentElement.dir=L[lang].rtl?'rtl':'ltr';$('title').textContent=T('title');document.title=T('title');draw()}
var sel=$('lang');Object.keys(L).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=L[k].n;if(k===lang)o.selected=true;sel.appendChild(o)});
sel.onchange=function(){lang=sel.value;try{localStorage.setItem('lang',lang)}catch(e){}setLang()};

function draw(){
  var v=$('view');v.textContent='';
  if(err||!data){v.appendChild(h('div',{class:'card muted'},T('unknown')));return}
  var d=data,pct=d.limitMB>0?Math.min(100,d.usedBytes/(d.limitMB*1048576)*100):0;
  var st=d.state;
  var msg={ok:['good',T('ok')],warn:['warn',T('warn',{p:Math.floor(pct)})],limit:['bad',T('limit')],blocked:['bad',T('blocked')],off:['bad',T('off')]}[st]||['good',''];
  if(st!=='ok'||d.limitMB===0)v.appendChild(h('div',{class:'banner '+msg[0]},h('b',null,T('hello',{n:d.name})),msg[1],
    (d.pending&&st==='warn')?h('button',{class:'go',onclick:ack},T('ack')):null));
  v.appendChild(h('div',{class:'card'},h('div',{class:'row'},h('span',{class:'muted small'},T('used')),h('span',{class:'muted small'},T('resets'))),
    h('div',{class:'big'},fmt(d.usedBytes)),
    d.limitMB>0?[h('div',{class:'meter '+(pct>=100?'b':pct>=80?'w':'')},h('i',{style:'width:'+pct.toFixed(1)+'%'})),
      h('div',{class:'row small muted'},h('span',null,T('of',{l:d.limitMB>=1024?(d.limitMB/1024).toFixed(d.limitMB%1024?1:0)+' GB':d.limitMB+' MB'})),
      h('span',null,pct>=100?'0':T('left',{x:fmt(Math.max(0,d.limitMB*1048576-d.usedBytes))})))]:h('div',{class:'muted small'},T('nolimit'))));
  var tot=d.cats.reduce(function(a,b){return a+b},0);
  if(tot>0){var bar=h('div',{class:'bar'}),leg=h('div',{class:'legend'});
    d.cats.forEach(function(x,i){if(!x)return;bar.appendChild(h('i',{style:'width:'+(x/tot*100).toFixed(2)+'%;background:var(--c'+i+')'}));
      leg.appendChild(h('span',null,h('em',{style:'background:var(--c'+i+')'}),T('cat')[i]+' '+Math.round(x/tot*100)+'%'))});
    v.appendChild(h('div',{class:'card'},h('h2',null,T('cats')),bar,leg))}
  var ht=d.hours.map(function(r){return r.reduce(function(a,b){return a+b},0)}),mx=Math.max.apply(null,ht.concat([1]));
  if(Math.max.apply(null,ht)>0){
    v.appendChild(h('div',{class:'card'},h('h2',null,T('hours')),h('div',{class:'chart'},d.hours.map(function(r,hr){
      return h('div',{class:'col',title:hr+':00 '+fmtKB(ht[hr])},r.map(function(x,c){return x?h('i',{style:'height:'+(x/mx*100).toFixed(2)+'%;background:var(--c'+c+')'}):null}))})),
      h('div',{class:'axis'},[0,3,6,9,12,15,18,21].map(function(x){return h('span',null,(x<10?'0':'')+x)}))))}
  if(d.apps.length)v.appendChild(h('div',{class:'card'},h('h2',null,T('apps')),h('table',null,d.apps.map(function(a){return h('tr',null,h('td',null,a[0]),h('td',{class:'n'},fmtKB(a[1])))}))));
  v.appendChild(h('div',{class:'card'},h('table',null,
    h('tr',null,h('td',null,T('speed')+' · '+T('down')),h('td',{class:'n'},spd(d.down))),
    h('tr',null,h('td',null,T('speed')+' · '+T('up')),h('td',{class:'n'},spd(d.up))),
    d.ads>0?h('tr',null,h('td',null,T('ads')),h('td',{class:'n'},d.ads)):null)));
}
function ack(){var x=new XMLHttpRequest();x.open('POST','/api/my/ack');x.setRequestHeader('X-Requested-With','my');x.onload=function(){load()};x.send()}
function load(){
  var x=new XMLHttpRequest();x.open('GET','/api/my');
  x.onload=function(){try{if(x.status===200){data=JSON.parse(x.responseText);err=false}else{err=true}}catch(e){err=true}draw()};
  x.onerror=function(){err=true;draw()};x.send();
}
setLang();load();setInterval(load,5000);
</script>
</body>
</html>

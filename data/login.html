<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Sign in · ESP32 Repeater</title>
<style>
  :root { --bg:#0b0f16; --surface:#141a24; --surface2:#1c2432; --line:#283142; --text:#e8ecf4; --muted:#97a2b6;
          --blue:#4c8dff; --red:#ff6b6b; --green:#3ecf8e; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#eef2f9; --surface:#ffffff; --surface2:#f1f4fa; --line:#d9e0ee; --text:#18202e; --muted:#5b6679; --blue:#2f6fe4; --red:#d93d3d; }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:20px;
         background:var(--bg); color:var(--text);
         font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif; }
  .box { width:100%; max-width:380px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:28px 24px 24px; }
  .logo { width:56px; height:56px; border-radius:16px; background:var(--blue); display:grid; place-items:center; margin:0 auto 14px; }
  .logo svg { width:30px; height:30px; stroke:#fff; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  h1 { font-size:1.3rem; margin:0 0 4px; text-align:center; font-weight:650; }
  .sub { color:var(--muted); text-align:center; font-size:.86rem; margin:0 0 22px; }
  label { display:block; font-size:.78rem; color:var(--muted); margin:14px 0 6px; }
  .field { position:relative; }
  input { width:100%; font:inherit; color:inherit; background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:12px 13px; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  #pass { padding-inline-end:64px; }
  .eye { position:absolute; inset-inline-end:6px; top:50%; transform:translateY(-50%); background:none; border:0; color:var(--muted);
         font:inherit; font-size:.78rem; padding:8px; cursor:pointer; border-radius:8px; }
  .go { width:100%; margin-top:20px; padding:13px; border:0; border-radius:12px; background:var(--blue); color:#fff; font:inherit; font-weight:650; cursor:pointer; }
  .go:disabled { opacity:.6; cursor:default; }
  #err { min-height:1.3em; margin-top:14px; font-size:.86rem; color:var(--red); text-align:center; }
  .lang { display:block; margin:18px auto 0; background:none; border:0; color:var(--muted); font:inherit; font-size:.82rem; cursor:pointer; padding:6px 10px; }
  .hint { color:var(--muted); font-size:.76rem; text-align:center; margin-top:10px; }
</style>
</head>
<body>
<main class="box">
  <form class="card" id="f" autocomplete="on">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 16.5h.01M11 16.5h.01"/><path d="M8 10a5.7 5.7 0 0 1 8 0M5.5 7.5a9.2 9.2 0 0 1 13 0"/></svg>
    </div>
    <h1 data-i18n="title">ESP32 Repeater</h1>
    <p class="sub" data-i18n="sub">Sign in to manage your network</p>

    <label for="user" data-i18n="user">Username</label>
    <input id="user" name="username" value="admin" autocomplete="username" autocapitalize="off" spellcheck="false" required>

    <label for="pass" data-i18n="pass">Password</label>
    <div class="field">
      <input id="pass" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="eye" type="button" id="eye" data-i18n="show">Show</button>
    </div>

    <button class="go" id="go" type="submit" data-i18n="signin">Sign in</button>
    <div id="err" role="alert" aria-live="assertive"></div>
    <div class="hint" data-i18n="hint">Forgot it? Hold the BOOT button on the board for 5 seconds.</div>
  </form>
  <button class="lang" id="lang" type="button">العربية</button>
</main>

<script>
'use strict';
const I18N = {
  en: { title:'ESP32 Repeater', sub:'Sign in to manage your network', user:'Username', pass:'Password', show:'Show', hide:'Hide', signin:'Sign in',
        signing:'Signing in...', bad:'Wrong username or password.', locked:(s)=>`Too many attempts. Try again in ${s} s.`,
        net:'Cannot reach the repeater. Check that you are connected to its WiFi.',
        hint:'Forgot it? Hold the BOOT button on the board for 5 seconds.' },
  ar: { title:'ريبيتر ESP32', sub:'سجّل الدخول لإدارة شبكتك', user:'اسم المستخدم', pass:'كلمة المرور', show:'إظهار', hide:'إخفاء', signin:'تسجيل الدخول',
        signing:'جارٍ الدخول...', bad:'اسم المستخدم أو كلمة المرور غير صحيحة.', locked:(s)=>`محاولات كثيرة. حاول بعد ${s} ثانية.`,
        net:'تعذّر الوصول إلى الريبيتر. تأكد أنك متصل بشبكته.',
        hint:'نسيتها؟ اضغط زر BOOT في اللوحة لمدة 5 ثوانٍ.' }
};
let lang = (navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en';
try { const s = localStorage.getItem('lang'); if (s === 'ar' || s === 'en') lang = s; } catch (e) {}
const t = (k) => I18N[lang][k] ?? I18N.en[k] ?? k;
const $ = (id) => document.getElementById(id);

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('lang').textContent = lang === 'ar' ? 'English' : 'العربية';
  $('eye').textContent = $('pass').type === 'password' ? t('show') : t('hide');
}
$('lang').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('lang', lang); } catch (e) {} applyLang(); };
$('eye').onclick = () => { $('pass').type = $('pass').type === 'password' ? 'text' : 'password'; applyLang(); };

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('err'), go = $('go');
  err.textContent = '';
  go.disabled = true; go.textContent = t('signing');
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'X-Requested-With': 'dashboard' },
      body: new URLSearchParams({ user: $('user').value.trim(), pass: $('pass').value }),
    });
    if (res.ok) { location.replace('/'); return; }
    if (res.status === 429) { let s = 60; try { s = (await res.json()).retryIn || 60; } catch (x) {} err.textContent = t('locked')(s); }
    else err.textContent = t('bad');
    $('pass').select();
  } catch (x) {
    err.textContent = t('net');
  }
  go.disabled = false; go.textContent = t('signin');
});

applyLang();
</script>
</body>
</html>
